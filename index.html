<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#0f172a;
  color:white;
  font-family:Arial;
}
.box {
  text-align:center;
}
.numero {
  font-size:60px;
  color:#22c55e;
}
</style>
</head>
<body>
<div class="box">
  <h2>DÍAS SIN ACCIDENTES</h2>
  <div class="numero" id="dias">0</div>
</div>

<script>
const fecha = new Date("2025-04-09"); // CAMBIA ESTA FECHA
const hoy = new Date();
const dias = Math.floor((hoy - fecha)/(1000*60*60*24));
document.getElementById("dias").innerText = dias;
</script>
</body>
</html>
